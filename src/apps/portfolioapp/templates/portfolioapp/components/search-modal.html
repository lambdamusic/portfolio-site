{% comment %}
  Google CSE search, opened from the drawer's FIND / SEARCH box.
  Lives in its own component so both the drawer and any page can trigger it.
{% endcomment %}

<div id="modalSearch" class="modal fade" role="dialog" tabindex="-1" aria-labelledby="modalSearchTitle">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">&times;</button>
        <h4 class="modal-title" id="modalSearchTitle">Find <span class="sep">/</span> michelepasin.org</h4>
      </div>

      <div class="modal-body">
        <gcse:search></gcse:search>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-default btn-xs" data-dismiss="modal">Close</button>
      </div>

    </div>
  </div>
</div>
