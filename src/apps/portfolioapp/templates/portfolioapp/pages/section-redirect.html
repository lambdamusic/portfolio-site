<!DOCTYPE html>
{% comment %}
  A section root with no page of its own (/blog/, /papers/). GitHub Pages
  can't send a real redirect, so this is a meta refresh plus a canonical.
{% endcomment %}
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting… | Michele Pasin</title>
    <link rel="canonical" href="{{ SITE_URL }}{{ target }}">
    <meta http-equiv="refresh" content="0; url={{ target }}">
  </head>
  <body>
    <p>This page has moved to <a href="{{ target }}">{{ SITE_URL }}{{ target }}</a>.</p>
  </body>
</html>
